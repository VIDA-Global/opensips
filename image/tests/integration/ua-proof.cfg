# Isolated API feasibility fixture; not production routing or media recovery.
log_level=1
stderror_enabled=yes
syslog_enabled=no
udp_workers=1
socket=udp:127.0.0.1:15060
mpath="/modules/"
loadmodule "proto_udp.so"
loadmodule "signaling.so"
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "sipmsgops.so"
loadmodule "uac_auth.so"
loadmodule "b2b_entities.so"
loadmodule "mi_script.so"
loadmodule "cachedb_local.so"
modparam("b2b_entities", "db_mode", 0)
modparam("b2b_entities", "advertised_contact", "sip:b2b@127.0.0.1:15060")

route {
    if (is_method("OPTIONS")) {
        if ($hdr(X-Proof-Update-Key) != NULL) {
            $var(sdp) = "v=0\r\no=proof 1 3 IN IP4 127.0.0.1\r\ns=proof\r\nc=IN IP4 127.0.0.1\r\nt=0 0\r\nm=audio 30006 RTP/AVP 0\r\na=sendrecv\r\n";
            ua_session_update($hdr(X-Proof-Update-Key), "INVITE", $var(sdp));
            $var(update_result) = $rc;
            append_to_reply("X-Proof-Update-Result: $var(update_result)\r\n");
        }
        mi("ua_session_list", $var(ua));
        mi("b2be_list", $var(entities));
        $var(answered) = 0;
        cache_fetch("local", "answered-events", $var(answered));
        append_to_reply("X-Proof-Answered: $var(answered)\r\n");
        append_to_reply("X-Proof-UA: $var(ua)\r\nX-Proof-Entities: $var(entities)\r\n");
        sl_send_reply(200, "OK");
        exit;
    }
    if (!is_method("INVITE") || has_totag()) {
        sl_send_reply(405, "Method Not Allowed");
        exit;
    }
    ua_session_server_init($var(server), "arhbn");
    $avp(names) = "ruri";
    $avp(values) = "sip:fs@127.0.0.1:15064";
    $avp(names) = "to";
    $avp(values) = "sip:fs@127.0.0.1:15064";
    $avp(names) = "from";
    $avp(values) = "sip:b2b@127.0.0.1:15060";
    $avp(names) = "body";
    $avp(values) = $rb;
    $avp(names) = "flags";
    $avp(values) = "arhb";
    if (!mi("ua_session_client_start", $var(result), $avp(names), $avp(values))) {
        ua_session_reply($var(server), "INVITE", 500, "Client Creation Failed");
        exit;
    }
    # The documented MI result is a JSON string containing a generated B2B key.
    $var(client) = $(var(result){s.substr,1,-1});
    cache_store("local", "peer:$var(server)", "$var(client)", 60);
    cache_store("local", "peer:$var(client)", "$var(server)", 60);
    cache_store("local", "client:$var(client)", "yes", 60);
    exit;
}

event_route[E_UA_SESSION] {
    if ($param(event_type) == "ANSWERED" && $param(method) == "INVITE") {
        cache_add("local", "answered-events", 1, 60);
    }
    $var(key) = $param(key);
    if (!cache_fetch("local", "peer:$var(key)", $var(peer))) exit;
    if ($param(event_type) == "ANSWERED" && $param(method) == "INVITE") {
        if (cache_fetch("local", "client:$var(key)", $var(is_client))) {
            if (!cache_fetch("local", "recover:$var(peer)", $var(recovery))) {
                ua_session_reply($var(peer), "INVITE", 200, "OK", $param(body));
            }
        } else {
            # Re-negotiate the existing backend leg after the source leg answered.
            $var(sdp) = "v=0\r\no=proof 1 2 IN IP4 127.0.0.1\r\ns=proof\r\nc=IN IP4 127.0.0.1\r\nt=0 0\r\nm=audio 30004 RTP/AVP 0\r\na=sendrecv\r\n";
            ua_session_update($var(peer), "INVITE", $var(sdp));
        }
    }
    if ($param(event_type) == "UPDATED" && $param(method) == "ACK") {
        if (!cache_fetch("local", "client:$var(key)", $var(is_client)) &&
            !cache_fetch("local", "recover:$var(key)", $var(recovery))) {
            cache_store("local", "recover:$var(key)", "yes", 60);
            $var(sdp) = "v=0\r\no=proof 1 2 IN IP4 127.0.0.1\r\ns=proof\r\nc=IN IP4 127.0.0.1\r\nt=0 0\r\nm=audio 30002 RTP/AVP 0\r\na=sendrecv\r\n";
            ua_session_update($var(key), "INVITE", $var(sdp));
        }
    }
}
